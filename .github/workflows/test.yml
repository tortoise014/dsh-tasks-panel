name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Host smoke (tools, storage, route)
        run: node test/host.mjs

      - name: Reminder scheduling (dedupe, grace, signing)
        run: node test/reminders.mjs

      - name: Client render (slots, hover cards, guide, settings)
        run: node test/ui.mjs
